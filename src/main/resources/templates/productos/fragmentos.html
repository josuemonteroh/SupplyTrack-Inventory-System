<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>

        <section th:fragment="agregar">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Productos</h4>
                    <p class="text-muted mb-0 small">Gestión de productos del inventario</p>
                </div>

                <button class="btn btn-primary d-flex align-items-center gap-2"
                        data-bs-toggle="modal"
                        data-bs-target="#modalAgregar">
                    <i class="fa-solid fa-plus"></i> Nuevo Producto
                </button>
            </div>


            <div class="modal fade" id="modalAgregar">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content border-0 shadow">

                        <div class="modal-header" style="background: var(--sidebar-bg);">
                            <h5 class="modal-title text-white">
                                <i class="fa-solid fa-box-open me-2"></i> Nuevo Producto
                            </h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/producto/guardar}" method="post">

                            <div class="modal-body p-4">

                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Código</label>
                                        <input type="text" name="codigo" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nombre</label>
                                        <input type="text" name="nombre" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Categoría</label>
                                        <select name="categoria.idCategoria" class="form-select" required>
                                            <option value="">Seleccione una categoría</option>
                                            <option th:each="cat : ${categorias}"
                                                    th:value="${cat.idCategoria}"
                                                    th:text="${cat.nombre}"></option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Precio</label>
                                        <input type="number" step="0.01" name="precio" class="form-control" required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Stock mínimo</label>
                                        <input type="number" name="stockMinimo" class="form-control" required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Stock máximo</label>
                                        <input type="number" name="stockMaximo" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Estado</label>
                                        <select name="estado" class="form-select">
                                            <option value="Activo">Activo</option>
                                            <option value="Inactivo">Inactivo</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Proveedor</label>
                                        <select name="proveedor.idProveedor" class="form-select" required>
                                            <option value="">Seleccione un proveedor</option>
                                            <option th:each="prov : ${proveedores}"
                                                    th:value="${prov.idProveedor}"
                                                    th:text="${prov.nombre}"></option>
                                        </select>
                                    </div>

                                </div>
                            </div>

                            <div class="modal-footer bg-light">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-primary">Guardar</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </section>


        <section th:fragment="listado">

            <div class="row g-3">

                <div class="col-xl-9">

                    <div class="card border-0 shadow-sm">

                        <div class="card-header bg-white">
                            <h6 class="fw-bold mb-0">
                                <i class="fa-solid fa-list me-2 text-primary"></i>
                                Listado de Productos
                            </h6>
                        </div>

                        <div class="card-body p-0">

                            <div class="table-responsive">

                                <table class="table table-hover align-middle mb-0">

                                    <thead class="table-light">
                                        <tr>
                                            <th>#</th>
                                            <th>Código</th>
                                            <th>Nombre</th>
                                            <th>Categoría</th>
                                            <th>Precio</th>
                                            <th>Stock Min</th>
                                            <th>Stock Max</th>
                                            <th>Estado</th>
                                            <th>Proveedor</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>

                                    <tbody>

                                        <tr th:each="p : ${productos}">

                                            <td th:text="${p.idProducto}"></td>
                                            <td th:text="${p.codigo}"></td>
                                            <td th:text="${p.nombre}"></td>
                                            <td th:text="${p.categoria != null ? p.categoria.nombre : 'S/C'}"></td>
                                            <td th:text="${p.precio}"></td>
                                            <td th:text="${p.stockMinimo}"></td>
                                            <td th:text="${p.stockMaximo}"></td>
                                            <td th:text="${p.estado}"></td>
                                            <td th:text="${p.proveedor != null ? p.proveedor.nombre : 'S/P'}"></td>

                                            <td class="text-center">

                                                <button class="btn btn-sm btn-outline-warning"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#modalEditar"
                                                        th:data-bs-id="${p.idProducto}"
                                                        th:data-bs-codigo="${p.codigo}"
                                                        th:data-bs-nombre="${p.nombre}"
                                                        th:data-bs-precio="${p.precio}"
                                                        th:data-bs-stock-minimo="${p.stockMinimo}"
                                                        th:data-bs-stock-maximo="${p.stockMaximo}"
                                                        th:data-bs-estado="${p.estado}"
                                                        th:data-bs-id-categoria="${p.categoria != null ? p.categoria.idCategoria : ''}"
                                                        th:data-bs-id-proveedor="${p.proveedor != null ? p.proveedor.idProveedor : ''}">
                                                    <i class="fa-solid fa-pen-to-square"></i>
                                                </button>

                                                <button class="btn btn-sm btn-outline-danger"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#modalEliminar"
                                                        th:data-bs-id="${p.idProducto}"
                                                        th:data-bs-nombre="${p.nombre}">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>

                                            </td>

                                        </tr>

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-xl-3">

                    <div class="card border-0 shadow-sm text-center p-3">

                        <div class="stat-icon mx-auto mb-3 bg-success bg-opacity-10 text-success">
                            <i class="fa-solid fa-box-open"></i>
                        </div>

                        <h6 class="text-muted mb-1">Total Productos</h6>
                        <h2 class="fw-bold mb-0" th:text="${totalProductos}">0</h2>

                    </div>

                </div>

            </div>

        </section>


        <div th:fragment="modalEditar" class="modal fade" id="modalEditar">

            <div class="modal-dialog">
                <div class="modal-content">

                    <form th:action="@{/producto/guardar}" method="post">

                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title">Editar Producto</h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <input type="hidden" id="editarId" name="idProducto">

                        <div class="modal-body">

                            <div class="mb-3">
                                <label>Código</label>
                                <input id="editarCodigo" name="codigo" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label>Nombre</label>
                                <input id="editarNombre" name="nombre" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label>Precio</label>
                                <input id="editarPrecio" name="precio" type="number" step="0.01" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Stock mínimo</label>
                                <input id="editarStockMinimo" name="stockMinimo" type="number" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Stock máximo</label>
                                <input id="editarStockMaximo" name="stockMaximo" type="number" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Estado</label>
                                <select id="editarEstado" name="estado" class="form-select" required>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Categoría</label>
                                <select id="editarCategoria" name="categoria.idCategoria" class="form-select" required>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.idCategoria}"
                                            th:text="${cat.nombre}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Proveedor</label>
                                <select id="editarProveedor" name="proveedor.idProveedor" class="form-select" required>
                                    <option th:each="prov : ${proveedores}"
                                            th:value="${prov.idProveedor}"
                                            th:text="${prov.nombre}"></option>
                                </select>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-success">Guardar</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>



        <div th:fragment="confirmarEliminar" class="modal fade" id="modalEliminar">

            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <form th:action="@{/producto/eliminar}" method="post">

                        <input type="hidden" id="eliminarId" name="idProducto">

                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title">Eliminar Producto</h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body text-center">

                            <p>¿Desea eliminar este producto?</p>
                            <h5 id="eliminarNombre"></h5>

                        </div>

                        <div class="modal-footer">

                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-danger">Eliminar</button>

                        </div>

                    </form>

                </div>
            </div>
        </div>



    <th:block th:fragment="scripts">

        <script>

            document.getElementById('modalEditar').addEventListener('show.bs.modal', function (e) {

                const btn = e.relatedTarget

                document.getElementById('editarId').value = btn.getAttribute('data-bs-id')
                document.getElementById('editarCodigo').value = btn.getAttribute('data-bs-codigo')
                document.getElementById('editarNombre').value = btn.getAttribute('data-bs-nombre')
                document.getElementById('editarPrecio').value = btn.getAttribute('data-bs-precio')
                document.getElementById('editarStockMinimo').value = btn.getAttribute('data-bs-stock-minimo')
                document.getElementById('editarStockMaximo').value = btn.getAttribute('data-bs-stock-maximo')
                document.getElementById('editarEstado').value = btn.getAttribute('data-bs-estado')
                document.getElementById('editarCategoria').value = btn.getAttribute('data-bs-id-categoria')
                document.getElementById('editarProveedor').value = btn.getAttribute('data-bs-id-proveedor')

            })

            document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (e) {

                const btn = e.relatedTarget

                document.getElementById('eliminarId').value = btn.getAttribute('data-bs-id')
                document.getElementById('eliminarNombre').textContent = btn.getAttribute('data-bs-nombre')

            })

        </script>

    </th:block>

</body>
</html>
