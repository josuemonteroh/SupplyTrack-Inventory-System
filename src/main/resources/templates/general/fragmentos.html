<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ═══════════════════════════════════════
     FRAGMENTO: head
     Uso: <head th:replace="~{general/fragmentos :: head}">
════════════════════════════════════════ -->
<head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupplyTrack</title>

    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <style>
        :root {
            --sidebar-w: 250px;
            --sidebar-collapsed-w: 70px;
            --sidebar-bg: #1e2a3a;
            --sidebar-hover: #2d3f55;
            --sidebar-active: #3b5278;
            --navbar-h: 56px;
            --accent: #4e8ef7;
        }

        body {
            margin: 0;
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ══════════════════════════════
           NAVBAR
        ══════════════════════════════ */
        .top-navbar {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--navbar-h);
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            z-index: 1040;
            transition: left 0.3s ease;
        }

        .btn-toggle {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: #555;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-toggle:hover { background: #f0f2f5; }

        .navbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-icon-btn {
            position: relative;
            background: none;
            border: none;
            color: #555;
            font-size: 1.15rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .nav-icon-btn:hover { background: #f0f2f5; }
        .badge-dot {
            position: absolute;
            top: 4px; right: 4px;
            width: 8px; height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .profile-trigger:hover { background: #f0f2f5; }

        .profile-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .profile-name { font-size: 0.875rem; font-weight: 600; color: #333; }
        .profile-role { font-size: 0.72rem; color: #888; line-height: 1; }

        @media (max-width: 576px) {
            .profile-info { display: none; }
            .top-navbar { left: var(--sidebar-collapsed-w); }
        }

        /* ══════════════════════════════
           SIDEBAR
        ══════════════════════════════ */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            z-index: 1050;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0 1rem;
            height: var(--navbar-h);
            border-bottom: 1px solid rgba(255,255,255,.07);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .sidebar-brand i { font-size: 1.4rem; color: var(--accent); min-width: 30px; text-align: center; }
        .sidebar-brand span { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: .5px; }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto; overflow-x: hidden;
            padding: 0.75rem 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.15) transparent;
        }

        .nav-label {
            font-size: 0.65rem; font-weight: 700;
            letter-spacing: 1.2px; text-transform: uppercase;
            color: rgba(255,255,255,.35);
            padding: 1rem 1.1rem 0.25rem;
            white-space: nowrap; overflow: hidden;
            transition: opacity 0.2s;
        }

        .sidebar-link {
            display: flex; align-items: center; gap: 0.85rem;
            padding: 0.65rem 1.1rem;
            color: rgba(255,255,255,.7);
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            position: relative;
        }
        .sidebar-link i { font-size: 1rem; min-width: 24px; text-align: center; flex-shrink: 0; }
        .sidebar-link span { font-size: 0.875rem; }
        .sidebar-link:hover { background: var(--sidebar-hover); color: #fff; }
        .sidebar-link.active { background: var(--sidebar-active); color: #fff; }
        .sidebar-link.active::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;
        }

        .nav-badge {
            margin-left: auto;
            font-size: 0.65rem; padding: 2px 7px;
            border-radius: 20px;
            background: var(--accent); color: #fff;
            flex-shrink: 0;
        }

        /* ── Collapsed ── */
        body.sidebar-collapsed .sidebar      { width: var(--sidebar-collapsed-w); }
        body.sidebar-collapsed .top-navbar   { left: var(--sidebar-collapsed-w); }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-w); }
        body.sidebar-collapsed .nav-label    { opacity: 0; }
        body.sidebar-collapsed .sidebar-link span,
        body.sidebar-collapsed .sidebar-brand span,
        body.sidebar-collapsed .nav-badge    { display: none; }
        body.sidebar-collapsed .sidebar-link { justify-content: center; padding: 0.75rem; }
        body.sidebar-collapsed .sidebar-link i { min-width: unset; }

        /* ── Submenu ── */
        .sidebar-submenu-btn {
            width: 100%; background: none; border: none;
            display: flex; align-items: center; gap: 0.85rem;
            padding: 0.65rem 1.1rem;
            color: rgba(255,255,255,.7);
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            cursor: pointer; text-align: left;
        }
        .sidebar-submenu-btn i.icon-main { font-size: 1rem; min-width: 24px; text-align: center; flex-shrink: 0; }
        .sidebar-submenu-btn span { font-size: 0.875rem; flex: 1; }
        .sidebar-submenu-btn .arrow { font-size: 0.7rem; transition: transform 0.25s; flex-shrink: 0; }
        .sidebar-submenu-btn:not(.collapsed) .arrow { transform: rotate(90deg); }
        .sidebar-submenu-btn:hover,
        .sidebar-submenu-btn:not(.collapsed) { background: var(--sidebar-hover); color: #fff; }

        .sidebar-submenu { background: rgba(0,0,0,.15); overflow: hidden; }
        .sidebar-sublink {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 1.1rem 0.5rem 2.5rem;
            color: rgba(255,255,255,.55);
            text-decoration: none; font-size: 0.825rem;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-sublink i { font-size: 0.8rem; min-width: 18px; text-align: center; flex-shrink: 0; }
        .sidebar-sublink:hover { background: var(--sidebar-hover); color: #fff; }
        .sidebar-sublink.active { color: var(--accent); }

        body.sidebar-collapsed .sidebar-submenu-btn span,
        body.sidebar-collapsed .sidebar-submenu-btn .arrow { display: none; }
        body.sidebar-collapsed .sidebar-submenu-btn { justify-content: center; padding: 0.75rem; }
        body.sidebar-collapsed .sidebar-submenu-btn i.icon-main { min-width: unset; }
        body.sidebar-collapsed .sidebar-submenu { display: none !important; }

        .sidebar-footer { border-top: 1px solid rgba(255,255,255,.07); padding: 0.5rem 0; flex-shrink: 0; }

        /* ══════════════════════════════
           MAIN CONTENT
        ══════════════════════════════ */
        .main-content {
            margin-left: var(--sidebar-w);
            margin-top: var(--navbar-h);
            padding: 1.5rem;
            min-height: calc(100vh - var(--navbar-h));
            transition: margin-left 0.3s ease;
        }

        @media (max-width: 576px) {
            .main-content { margin-left: var(--sidebar-collapsed-w); }
        }

        .stat-card {
            border: none; border-radius: 12px;
            padding: 1.25rem;
            display: flex; align-items: center; gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }
        .stat-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .stat-card h6 { margin: 0; font-size: 0.75rem; color: #888; }
        .stat-card h3 { margin: 0; font-weight: 700; }
    </style>
</head>

<body>

<!-- ═══════════════════════════════════════
     FRAGMENTO: sidebar
════════════════════════════════════════ -->
<aside th:fragment="sidebar" class="sidebar">

    <a th:href="@{/}" class="sidebar-brand">
        <i class="fa-solid fa-truck-fast"></i>
        <span>SupplyTrack</span>
    </a>

    <nav class="sidebar-nav">

        <div class="nav-label">Principal</div>

        <a th:href="@{/}" th:classappend="${activeMenu == 'dashboard'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <div class="nav-label">Gestión</div>

        <a th:href="@{/proveedor/listado}" th:classappend="${activeMenu == 'proveedores'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-handshake"></i>
            <span>Proveedores</span>
        </a>

        <a th:href="@{/producto/listado}" th:classappend="${activeMenu == 'productos'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-box-open"></i>
            <span>Productos</span>
        </a>

        <a th:href="@{/categoria/listado}" th:classappend="${activeMenu == 'categorias'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-tags"></i>
            <span>Categorías</span>
        </a>

        <a th:href="@{/pedido/listado}" th:classappend="${activeMenu == 'pedidos'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Pedidos</span>
        </a>

        <div class="nav-label">Administración</div>

        <a th:href="@{/usuario/listado}" th:classappend="${activeMenu == 'usuarios'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-users"></i>
            <span>Usuarios</span>
        </a>

        <button
            class="sidebar-submenu-btn collapsed"
            data-bs-toggle="collapse"
            data-bs-target="#submenuConfig"
            aria-expanded="false">
            <i class="fa-solid fa-gear icon-main"></i>
            <span>Configuración</span>
            <i class="fa-solid fa-chevron-right arrow"></i>
        </button>
        <div class="collapse sidebar-submenu" id="submenuConfig">
            <a th:href="@{/}" class="sidebar-sublink">
                <i class="fa-solid fa-palette"></i> Apariencia
            </a>
            <a th:href="@{/}" class="sidebar-sublink">
                <i class="fa-solid fa-language"></i> Idioma
            </a>
            <a th:href="@{/}" class="sidebar-sublink">
                <i class="fa-solid fa-database"></i> Base de datos
            </a>
        </div>

    </nav>

    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="sidebar-link text-danger">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Cerrar sesión</span>
        </a>
    </div>

</aside>


<!-- ═══════════════════════════════════════
     FRAGMENTO: navbar
════════════════════════════════════════ -->
<header th:fragment="navbar" class="top-navbar">

    <button class="btn-toggle" id="sidebarToggle" title="Menú">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav aria-label="breadcrumb" class="ms-3 d-none d-md-block">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a th:href="@{/}" class="text-decoration-none text-muted">Inicio</a>
            </li>
            <li class="breadcrumb-item active" th:text="${pageTitle != null} ? ${pageTitle} : 'Dashboard'">
                Dashboard
            </li>
        </ol>
    </nav>

    <div class="navbar-right">
        <div class="vr mx-1 d-none d-sm-block"></div>
        <div class="dropdown">
            <button
                class="profile-trigger dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                style="--bs-btn-padding-x:0; text-align:left;">
                <img
                    src="https://ui-avatars.com/api/?name=Admin&background=4e8ef7&color=fff&size=72"
                    alt="Avatar"
                    class="profile-avatar" />
                <div class="profile-info">
                    <div class="profile-name">Administrador</div>
                    <div class="profile-role">SupplyTrack</div>
                </div>
            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2"
                style="min-width:200px; border-radius:10px;">
                <li>
                    <div class="px-3 py-2 border-bottom mb-1">
                        <div class="fw-semibold small">Administrador</div>
                        <div class="text-muted" style="font-size:.75rem;">admin@supplytrack.com</div>
                    </div>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" th:href="@{/perfil}">
                        <i class="fa-solid fa-user fa-fw text-primary"></i> Mi perfil
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" th:href="@{/}">
                        <i class="fa-solid fa-gear fa-fw text-secondary"></i> Configuración
                    </a>
                </li>
                <li><hr class="dropdown-divider my-1" /></li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger" th:href="@{/logout}">
                        <i class="fa-solid fa-right-from-bracket fa-fw"></i> Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>


<!-- ═══════════════════════════════════════
     FRAGMENTO: mostrarToast
════════════════════════════════════════ -->
<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true"
         class="position-fixed top-0 start-50 translate-middle-x mt-3"
         style="z-index: 1080;">

        <div th:if="${error}" class="toast show"
             role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true">
            <div class="toast-header text-white bg-danger">
                <i class="fa-solid fa-bomb me-2"></i>
                <strong class="me-auto">Error</strong>
            </div>
            <div class="toast-body">
                <p th:text="${error}"></p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast">Cerrar</button>
                </div>
            </div>
        </div>

        <div th:if="${todoOk}" class="toast show"
             role="status" aria-live="polite" aria-atomic="true" data-bs-autohide="true">
            <div class="toast-header text-white bg-success">
                <i class="fa-solid fa-square-check me-2"></i>
                <strong class="me-auto">Atención</strong>
            </div>
            <div class="toast-body">
                <p th:text="${todoOk}"></p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast">Cerrar</button>
                </div>
            </div>
        </div>

    </div>
</section>


<!-- ═══════════════════════════════════════
     FRAGMENTO: scripts
════════════════════════════════════════ -->
<th:block th:fragment="scripts">
    <script>
        const toggle = document.getElementById('sidebarToggle');
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('sidebar-collapsed');
        });

        function checkScreen() {
            if (window.innerWidth < 576) {
                document.body.classList.add('sidebar-collapsed');
            } else {
                document.body.classList.remove('sidebar-collapsed');
            }
        }
        checkScreen();
        window.addEventListener('resize', checkScreen);
    </script>
</th:block>

</body>
</html>
