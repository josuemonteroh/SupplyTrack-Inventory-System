<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>

        <section th:fragment="agregar">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Categorías</h4>
                    <p class="text-muted mb-0 small">Gestión de categorías de productos</p>
                </div>

                <button class="btn btn-primary d-flex align-items-center gap-2"
                        data-bs-toggle="modal"
                        data-bs-target="#modalAgregar">
                    <i class="fa-solid fa-plus"></i> Nueva Categoría
                </button>
            </div>

            <div class="modal fade" id="modalAgregar">
                <div class="modal-dialog">
                    <div class="modal-content border-0 shadow">
                        <div class="modal-header" style="background: var(--sidebar-bg);">
                            <h5 class="modal-title text-white">
                                <i class="fa-solid fa-tags me-2"></i> Nueva Categoría
                            </h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <form th:action="@{/categoria/guardar}" method="post">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre</label>
                                    <input type="text" name="nombre" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Descripción</label>
                                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer bg-light">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </section>

        <section th:fragment="listado">
            <div class="row g-3">
                <div class="col-xl-9">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white">
                            <h6 class="fw-bold mb-0">
                                <i class="fa-solid fa-list me-2 text-primary"></i>
                                Listado de Categorías
                            </h6>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>#</th>
                                            <th>Nombre</th>
                                            <th>Descripción</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="c, status : ${categorias}">
                                            <td th:text="${status.count}"></td>
                                            <td th:text="${c.nombre}"></td>
                                            <td th:text="${c.descripcion}"></td>
                                            <td class="text-center">
                                                <button class="btn btn-sm btn-outline-warning"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#modalEditar"
                                                        th:data-bs-id="${c.idCategoria}"
                                                        th:data-bs-nombre="${c.nombre}"
                                                        th:data-bs-descripcion="${c.descripcion}">
                                                    <i class="fa-solid fa-pen-to-square"></i>
                                                </button>
                                                <button class="btn btn-sm btn-outline-danger"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#modalEliminar"
                                                        th:data-bs-id="${c.idCategoria}"
                                                        th:data-bs-nombre="${c.nombre}">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <div class="stat-icon mx-auto mb-3 bg-primary bg-opacity-10 text-primary">
                            <i class="fa-solid fa-tags"></i>
                        </div>
                        <h6 class="text-muted mb-1">Total Categorías</h6>
                        <h2 class="fw-bold mb-0" th:text="${totalCategorias}">0</h2>
                    </div>
                </div>
            </div>
        </section>

        <div th:fragment="modalEditar" class="modal fade" id="modalEditar">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/categoria/guardar}" method="post">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title">Editar Categoría</h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <input type="hidden" id="editarId" name="idCategoria">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label>Nombre</label>
                                <input id="editarNombre" name="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Descripción</label>
                                <textarea id="editarDescripcion" name="descripcion" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-success">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:fragment="confirmarEliminar" class="modal fade" id="modalEliminar">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/categoria/eliminar}" method="post">
                        <input type="hidden" id="eliminarId" name="idCategoria">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title">Eliminar Categoría</h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center">
                            <p>¿Desea eliminar esta categoría?</p>
                            <h5 id="eliminarNombre"></h5>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-danger">Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <th:block th:fragment="scripts">
            <script>
                document.getElementById('modalEditar').addEventListener('show.bs.modal', function (e) {
                    const btn = e.relatedTarget
                    document.getElementById('editarId').value = btn.getAttribute('data-bs-id')
                    document.getElementById('editarNombre').value = btn.getAttribute('data-bs-nombre')
                    document.getElementById('editarDescripcion').value = btn.getAttribute('data-bs-descripcion')
                })

                document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (e) {
                    const btn = e.relatedTarget
                    document.getElementById('eliminarId').value = btn.getAttribute('data-bs-id')
                    document.getElementById('eliminarNombre').textContent = btn.getAttribute('data-bs-nombre')
                })
            </script>
        </th:block>

    </body>
</html>
